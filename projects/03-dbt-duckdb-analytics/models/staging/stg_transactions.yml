version: 2

models:
  - name: stg_transactions
    description: Cleaned retail line items with standardized names (staging layer).
    columns:
      - name: invoice_id
        description: Invoice / order id
        tests:
          - not_null
      - name: customer_id
        description: Customer key
        tests:
          - not_null
      - name: invoice_date
        tests:
          - not_null
      - name: line_revenue
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
